name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[build]"
      - run: python scripts/package_release.py linux
      - name: Build DEB and RPM packages
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm zstd
          sudo gem install fpm --no-document
          fpm -s dir -t deb -n devmesh-studio -v "$VERSION" -a amd64 \
            --license GPL-3.0-or-later --description "Local developer control plane for ChatGPT over MCP" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            -C dist/release/linux-fhs -p "dist/release/DevMesh-Studio-${VERSION}-Linux-amd64.deb" .
          fpm -s dir -t rpm -n devmesh-studio -v "$VERSION" -a x86_64 \
            --license GPL-3.0-or-later --description "Local developer control plane for ChatGPT over MCP" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            -C dist/release/linux-fhs -p "dist/release/DevMesh-Studio-${VERSION}-Linux-x86_64.rpm" .
          fpm -s dir -t pacman -n devmesh-studio -v "$VERSION" -a x86_64 \
            --license GPL-3.0-or-later --description "Local developer control plane for ChatGPT over MCP" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            -C dist/release/linux-fhs -p "dist/release/DevMesh-Studio-${VERSION}-Linux-x86_64.pkg.tar.zst" .
      - name: Build AppImage
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool dist/release/DevMesh.AppDir "dist/release/DevMesh-Studio-${VERSION}-Linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/release/*.tar.gz
            dist/release/*.deb
            dist/release/*.rpm
            dist/release/*.pkg.tar.zst
            dist/release/*.AppImage

  windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python scripts/bootstrap.py build-windows --source .
      - name: Build portable archive and installer
        shell: pwsh
        env:
          DEVMESH_RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Compress-Archive -Path "dist\windows\DevMesh Studio.exe", "dist\windows\devmesh-server.exe" -DestinationPath "dist\release\DevMesh-Studio-$env:DEVMESH_RELEASE_VERSION-Windows-x86_64-Portable.zip"
          $env:DEVMESH_WINDOWS_DIST = (Resolve-Path "dist\windows").Path
          $env:DEVMESH_RELEASE_DIR = (Resolve-Path "dist\release").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          & $compiler packaging\windows\DevMesh.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*-Setup.exe

  macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[build]"
      - run: python scripts/package_release.py macos
      - name: Ad-hoc sign application and create DMG
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          codesign --force --deep --sign - "dist/release/DevMesh Studio.app"
          ARCH=$(uname -m)
          rm -f dist/release/DevMesh-Studio-*-macOS-*.tar.gz
          tar -C dist/release -czf "dist/release/DevMesh-Studio-${VERSION}-macOS-${ARCH}.tar.gz" "DevMesh Studio.app"
          mkdir -p dist/release/dmg
          cp -R "dist/release/DevMesh Studio.app" dist/release/dmg/
          ln -s /Applications dist/release/dmg/Applications
          hdiutil create -volname "DevMesh Studio" -srcfolder dist/release/dmg -ov -format UDZO "dist/release/DevMesh-Studio-${VERSION}-macOS-${ARCH}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/release/*.tar.gz
            dist/release/*.dmg

  publish-assets:
    needs: [release-please, linux, windows, macos]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
